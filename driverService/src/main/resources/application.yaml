spring:
  application:
    name: driverService
  config:
    import: optional:file:./.env[.properties]
  mongodb:
    uri: "${DRIVER_MONGODB_URI:mongodb://localhost:27017/flashcab_drivers}"

location:
  service:
    url: "${DRIVER_LOCATION_SERVICE_URL:http://localhost:8082}"

server:
  port: "${DRIVER_SERVER_PORT:8085}"

management:
  endpoints:
    web:
      exposure:
        include: health, info