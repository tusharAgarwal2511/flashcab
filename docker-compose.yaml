services:
  # REDIS 
  redis:
    image: redis:latest
    container_name: redis-geo
    ports:
      - "${FLASHCAB_REDIS_HOST_PORT:-6379}:6379"
    networks:
      - flashcab

  # MYSQL
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${FLASHCAB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flashcab_rides
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - flashcab

  # ZOOKEEPER 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "${FLASHCAB_ZOOKEEPER_HOST_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flashcab

  # KAFKA 
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "${FLASHCAB_KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${FLASHCAB_KAFKA_ADVERTISED_HOST:-localhost}:${FLASHCAB_KAFKA_HOST_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - flashcab

volumes:
  mysql-data:

networks:
  flashcab:
    driver: bridge