spring:
  application:
    name: matchingService
  config:
    import: optional:file:./.env[.properties]

  kafka:
    bootstrap-servers: "${MATCHING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"

    consumer:
      group-id: matching-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flashCab.matchingService.event"
        spring.json.value.default.type: "com.flashCab.matchingService.event.RideRequestedEvent"
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

location:
  service:
    url: "${MATCHING_LOCATION_SERVICE_URL:http://localhost:8082}"

driver:
  service:
    url: "${MATCHING_DRIVER_SERVICE_URL:http://localhost:8085}"

management:
  endpoints:
    web:
      exposure:
        include: health, info

server:
  port: "${MATCHING_SERVER_PORT:8084}"