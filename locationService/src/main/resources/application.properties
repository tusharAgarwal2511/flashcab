spring.application.name=locationService
spring.config.import=optional:file:./.env[.properties]
server.port=${LOCATION_SERVER_PORT:8082}
# Redis
spring.data.redis.host=${LOCATION_REDIS_HOST:localhost}
spring.data.redis.port=${LOCATION_REDIS_PORT:6379}
# Feign
driver.service.url=${LOCATION_DRIVER_SERVICE_URL:http://localhost:8085}
# Actuator
management.endpoints.web.exposure.include=health, info
