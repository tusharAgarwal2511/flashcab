spring:
  application:
    name: rideService
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: "${RIDE_MYSQL_URL:jdbc:mysql://localhost:3306/flashcab_rides}"
    username: "${RIDE_MYSQL_USERNAME:root}"
    password: "${RIDE_MYSQL_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: "${RIDE_JPA_DDL_AUTO:update}"
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: "${RIDE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: ride-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.flashCab.rideService.event.RideMatchedEvent"

rider:
  service:
    url: "${RIDE_RIDER_SERVICE_URL:http://localhost:8086}"

driver:
  service:
    url: "${RIDE_DRIVER_SERVICE_URL:http://localhost:8085}"

location:
  service:
    url: "${RIDE_LOCATION_SERVICE_URL:http://localhost:8082}"

open-meteo:
  service:
    url: "${RIDE_OPEN_METEO_BASE_URL:https://api.open-meteo.com}"

fare:
  vehicle:
    MINI:
      base-fare: 40.0
      per-km-rate: 10.0
    SEDAN:
      base-fare: 50.0
      per-km-rate: 12.0
    SUV:
      base-fare: 80.0
      per-km-rate: 18.0
    PREMIUM:
      base-fare: 120.0
      per-km-rate: 25.0
    BIKE:
      base-fare: 20.0
      per-km-rate: 6.0

management:
  endpoints:
    web:
      exposure:
        include: health, info

server:
  port: "${RIDE_SERVER_PORT:8083}"
