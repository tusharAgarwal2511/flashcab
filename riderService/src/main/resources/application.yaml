spring:
  application:
    name: riderService
  config:
    import: optional:file:./.env[.properties]
  mongodb:
    uri: "${RIDER_MONGODB_URI:mongodb://localhost:27017/flashcab_riders}"

server:
  port: "${RIDER_SERVER_PORT:8086}"

management:
  endpoints:
    web:
      exposure:
        include: health, info