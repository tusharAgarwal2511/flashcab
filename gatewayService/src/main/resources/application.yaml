spring:
  application:
    name: gatewayService
  config:
    import: optional:file:./.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: riders
              uri: "${GATEWAY_RIDER_SERVICE_URL:http://localhost:8086}"
              predicates:
                - Path=/api/v1/riders/**
            - id: drivers
              uri: "${GATEWAY_DRIVER_SERVICE_URL:http://localhost:8085}"
              predicates:
                - Path=/api/v1/drivers/**
            - id: locations
              uri: "${GATEWAY_LOCATION_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/v1/locations/**
            - id: rides
              uri: "${GATEWAY_RIDE_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/api/v1/rides/**
            - id: auth
              uri: "${GATEWAY_AUTH_SERVICE_URL:http://localhost:8087}"
              predicates:
                - Path=/auth/**
            - id: rider-openapi
              uri: "${GATEWAY_RIDER_SERVICE_URL:http://localhost:8086}"
              predicates:
                - Path=/rider-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: driver-openapi
              uri: "${GATEWAY_DRIVER_SERVICE_URL:http://localhost:8085}"
              predicates:
                - Path=/driver-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: location-openapi
              uri: "${GATEWAY_LOCATION_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/location-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: ride-openapi
              uri: "${GATEWAY_RIDE_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/ride-service/v3/api-docs/**
              filters:
                - StripPrefix=1

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: Rider Service
    urls:
      - name: Rider Service
        url: /rider-service/v3/api-docs
      - name: Driver Service
        url: /driver-service/v3/api-docs
      - name: Location Service
        url: /location-service/v3/api-docs
      - name: Ride Service
        url: /ride-service/v3/api-docs

server:
  port: "${GATEWAY_SERVER_PORT:8081}"
